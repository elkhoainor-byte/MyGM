<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selector de Posiciones - Campo de Fútbol</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 1.6rem;
      text-align: center;
    }

    .selected-info {
      background: #16213e;
      padding: 12px 24px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 1.2rem;
      min-width: 280px;
      text-align: center;
      border: 2px solid #0f3460;
    }

    .selected-info span {
      color: #e94560;
      font-weight: bold;
    }

    .pitch-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      aspect-ratio: 68 / 105;
      background: linear-gradient(to bottom, #2e7d32, #1b5e20);
      border: 4px solid #fff;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    /* Líneas del campo */
    .pitch-container::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        /* Línea central */
        linear-gradient(#fff, #fff) center / 100% 3px no-repeat,
        /* Círculo central */
        radial-gradient(circle, transparent 48px, #fff 48px, #fff 51px, transparent 51px) center / 110px 110px no-repeat,
        /* Área grande inferior (portería) */
        linear-gradient(#fff, #fff) bottom 0 left 50% / 55% 18% no-repeat,
        linear-gradient(#fff, #fff) bottom 0 left 50% / 3px 18% no-repeat,
        linear-gradient(#fff, #fff) bottom 18% left 50% / 55% 3px no-repeat,
        /* Área pequeña inferior */
        linear-gradient(#fff, #fff) bottom 0 left 50% / 28% 8% no-repeat,
        linear-gradient(#fff, #fff) bottom 0 left 50% / 3px 8% no-repeat,
        linear-gradient(#fff, #fff) bottom 8% left 50% / 28% 3px no-repeat,
        /* Área grande superior */
        linear-gradient(#fff, #fff) top 0 left 50% / 55% 18% no-repeat,
        linear-gradient(#fff, #fff) top 0 left 50% / 3px 18% no-repeat,
        linear-gradient(#fff, #fff) top 18% left 50% / 55% 3px no-repeat,
        /* Área pequeña superior */
        linear-gradient(#fff, #fff) top 0 left 50% / 28% 8% no-repeat,
        linear-gradient(#fff, #fff) top 0 left 50% / 3px 8% no-repeat,
        linear-gradient(#fff, #fff) top 8% left 50% / 28% 3px no-repeat;
      opacity: 0.9;
      pointer-events: none;
    }

    /* Puntos de posición */
    .position {
      position: absolute;
      width: 28px;
      height: 28px;
      background: #fff;
      border: 3px solid #333;
      border-radius: 50%;
      cursor: pointer;
      transform: translate(-50%, -50%);
      transition: all 0.2s ease;
      z-index: 10;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    .position:hover {
      transform: translate(-50%, -50%) scale(1.25);
      background: #ffeb3b;
      border-color: #f57f17;
    }

    .position.selected {
      background: #e94560;
      border-color: #fff;
      transform: translate(-50%, -50%) scale(1.3);
      box-shadow: 0 0 0 4px rgba(233, 69, 96, 0.4);
    }

    .position::after {
      content: attr(data-label);
      position: absolute;
      bottom: 120%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .position:hover::after,
    .position.selected::after {
      opacity: 1;
    }

    /* ========== POSICIONES RECTAS (BANDAS ALINEADAS) ========== */

    /* Portero */
    #pos-portero { top: 92%; left: 50%; }

    /* Defensas */
    #pos-lateral-derecho { top: 78%; left: 86%; }
    #pos-defensa-central { top: 80%; left: 50%; }
    #pos-lateral-izquierdo { top: 78%; left: 14%; }

    /* Carrileros y Mediocentro */
    #pos-carrilero-derecho { top: 60%; left: 86%; }
    #pos-mediocentro { top: 62%; left: 50%; }
    #pos-carrilero-izquierdo { top: 60%; left: 14%; }

    /* Centrocampistas */
    #pos-centrocampista-derecho { top: 45%; left: 86%; }
    #pos-centrocampista { top: 48%; left: 50%; }
    #pos-centrocampista-izquierdo { top: 45%; left: 14%; }

    /* Mediapuntas */
    #pos-mediapunta-derecho { top: 30%; left: 86%; }
    #pos-mediapunta { top: 28%; left: 50%; }
    #pos-mediapunta-izquierdo { top: 30%; left: 14%; }

    /* Delantero */
    #pos-delantero { top: 12%; left: 50%; }
  </style>
</head>
<body>
  <h1>⚽ Selector de Posición</h1>
  
  <div class="selected-info">
    Posición seleccionada: <span id="selected-name">Ninguna</span>
  </div>

  <div class="pitch-container" id="pitch">
    <!-- Portero -->
    <div class="position" id="pos-portero" data-name="Portero" data-label="Portero"></div>

    <!-- Defensas -->
    <div class="position" id="pos-lateral-derecho" data-name="Lateral derecho" data-label="Lateral Dcho"></div>
    <div class="position" id="pos-defensa-central" data-name="Defensa central" data-label="Def. Central"></div>
    <div class="position" id="pos-lateral-izquierdo" data-name="Lateral izquierdo" data-label="Lateral Izq"></div>

    <!-- Carrileros y Mediocentro -->
    <div class="position" id="pos-carrilero-derecho" data-name="Carrilero derecho" data-label="Carrilero Dcho"></div>
    <div class="position" id="pos-mediocentro" data-name="Mediocentro" data-label="Mediocentro"></div>
    <div class="position" id="pos-carrilero-izquierdo" data-name="Carrilero izquierdo" data-label="Carrilero Izq"></div>

    <!-- Centrocampistas -->
    <div class="position" id="pos-centrocampista-derecho" data-name="Centrocampista derecho" data-label="Centro Dcho"></div>
    <div class="position" id="pos-centrocampista" data-name="Centrocampista" data-label="Centrocampista"></div>
    <div class="position" id="pos-centrocampista-izquierdo" data-name="Centrocampista izquierdo" data-label="Centro Izq"></div>

    <!-- Mediapuntas -->
    <div class="position" id="pos-mediapunta-derecho" data-name="Mediapunta derecho" data-label="Mediapunta Dcho"></div>
    <div class="position" id="pos-mediapunta" data-name="Mediapunta" data-label="Mediapunta"></div>
    <div class="position" id="pos-mediapunta-izquierdo" data-name="Mediapunta izquierdo" data-label="Mediapunta Izq"></div>

    <!-- Delantero -->
    <div class="position" id="pos-delantero" data-name="Delantero" data-label="Delantero"></div>
  </div>

  <p class="instructions" style="margin-top: 18px; opacity: 0.8; text-align: center;">
    Haz clic en un punto para seleccionar la posición.<br>
    Solo se puede elegir una a la vez.
  </p>

  <script>
    const positions = document.querySelectorAll('.position');
    const selectedName = document.getElementById('selected-name');

    positions.forEach(pos => {
      pos.addEventListener('click', () => {
        positions.forEach(p => p.classList.remove('selected'));
        pos.classList.add('selected');
        selectedName.textContent = pos.dataset.name;
      });
    });
  </script>
</body>
</html>
