<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selector de Posiciones + Atributos</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d0d0d;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      padding: 20px;
      gap: 30px;
      overflow-x: auto;
    }

    /* ===== CAMPO (izquierda) ===== */
    .left-side {
      flex-shrink: 0;
    }

    h1 {
      font-size: 1.3rem;
      margin-bottom: 14px;
      color: #fff;
    }

    .pitch-container {
      position: relative;
      width: 280px;
      aspect-ratio: 68 / 105;
      /* Fondo gris difuminado a negro de arriba abajo */
      background: linear-gradient(to bottom, #2a2a2a, #0a0a0a);
      border: 1.5px solid #ffffff;
      border-radius: 3px;
    }

    /* Solo líneas blancas (sin relleno de áreas) */
    .pitch-container::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        /* Línea central horizontal */
        linear-gradient(#fff, #fff) center / 100% 1.5px no-repeat,

        /* Círculo central (solo borde) */
        radial-gradient(circle, transparent 38px, #fff 38px, #fff 39.5px, transparent 39.5px) center / 80px 80px no-repeat,

        /* ===== ÁREA GRANDE INFERIOR (solo bordes) ===== */
        /* línea izquierda */
        linear-gradient(#fff, #fff) bottom 0 left calc(50% - 26%) / 1.5px 15% no-repeat,
        /* línea derecha */
        linear-gradient(#fff, #fff) bottom 0 left calc(50% + 26%) / 1.5px 15% no-repeat,
        /* línea superior del área */
        linear-gradient(#fff, #fff) bottom 15% left 50% / 52% 1.5px no-repeat,

        /* ===== ÁREA PEQUEÑA INFERIOR (solo bordes) ===== */
        linear-gradient(#fff, #fff) bottom 0 left calc(50% - 13%) / 1.5px 6.5% no-repeat,
        linear-gradient(#fff, #fff) bottom 0 left calc(50% + 13%) / 1.5px 6.5% no-repeat,
        linear-gradient(#fff, #fff) bottom 6.5% left 50% / 26% 1.5px no-repeat,

        /* ===== ÁREA GRANDE SUPERIOR (solo bordes) ===== */
        linear-gradient(#fff, #fff) top 0 left calc(50% - 26%) / 1.5px 15% no-repeat,
        linear-gradient(#fff, #fff) top 0 left calc(50% + 26%) / 1.5px 15% no-repeat,
        linear-gradient(#fff, #fff) top 15% left 50% / 52% 1.5px no-repeat,

        /* ===== ÁREA PEQUEÑA SUPERIOR (solo bordes) ===== */
        linear-gradient(#fff, #fff) top 0 left calc(50% - 13%) / 1.5px 6.5% no-repeat,
        linear-gradient(#fff, #fff) top 0 left calc(50% + 13%) / 1.5px 6.5% no-repeat,
        linear-gradient(#fff, #fff) top 6.5% left 50% / 26% 1.5px no-repeat;
    }

    /* Círculos de posición */
    .position {
      position: absolute;
      width: 18px;
      height: 18px;
      background: #111;
      border: 1.5px solid #ccc;
      border-radius: 50%;
      cursor: pointer;
      transform: translate(-50%, -50%);
      transition: all 0.2s ease;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .position:hover {
      transform: translate(-50%, -50%) scale(1.25);
      border-color: #fff;
    }

    .position.selected {
      background: #111;
      border: 2.5px solid #f5c518;
      box-shadow: 0 0 0 2px rgba(245, 197, 24, 0.3);
    }

    .position.selected::before {
      content: '✓';
      color: #fff;
      font-size: 11px;
      font-weight: bold;
    }

    /* Posiciones */
    #pos-portero                 { top: 92%; left: 50%; }
    #pos-lateral-derecho         { top: 78%; left: 86%; }
    #pos-defensa-central         { top: 80%; left: 50%; }
    #pos-lateral-izquierdo       { top: 78%; left: 14%; }
    #pos-carrilero-derecho       { top: 60%; left: 86%; }
    #pos-mediocentro             { top: 62%; left: 50%; }
    #pos-carrilero-izquierdo     { top: 60%; left: 14%; }
    #pos-centrocampista-derecho  { top: 45%; left: 86%; }
    #pos-centrocampista          { top: 48%; left: 50%; }
    #pos-centrocampista-izquierdo{ top: 45%; left: 14%; }
    #pos-mediapunta-derecho      { top: 30%; left: 86%; }
    #pos-mediapunta              { top: 28%; left: 50%; }
    #pos-mediapunta-izquierdo    { top: 30%; left: 14%; }
    #pos-delantero               { top: 12%; left: 50%; }

    /* ===== PANEL DE ATRIBUTOS ===== */
    .stats-panel {
      flex: 1;
      min-width: 620px;
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 18px 20px;
      overflow-y: auto;
      max-height: calc(100vh - 40px);
    }

    .stats-header {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #333;
      font-weight: 600;
      font-size: 0.95rem;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px 16px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      font-size: 0.88rem;
    }

    .stat-row label {
      color: #ccc;
      flex: 1;
    }

    .stat-row input {
      width: 70px;
      background: #0d0d0d;
      border: 1px solid #333;
      border-radius: 4px;
      color: #4fc3f7;
      text-align: center;
      padding: 3px 6px;
      font-size: 0.85rem;
      outline: none;
    }

    .stat-row input:focus {
      border-color: #4fc3f7;
    }

    .selected-pos {
      margin-bottom: 12px;
      font-size: 1.05rem;
    }

    .selected-pos span {
      color: #f5c518;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- CAMPO -->
  <div class="left-side">
    <h1>⚽ Posición</h1>
    <div class="pitch-container" id="pitch">
      <div class="position" id="pos-portero" data-name="Portero"></div>
      <div class="position" id="pos-lateral-derecho" data-name="Lateral derecho"></div>
      <div class="position" id="pos-defensa-central" data-name="Defensa central"></div>
      <div class="position" id="pos-lateral-izquierdo" data-name="Lateral izquierdo"></div>
      <div class="position" id="pos-carrilero-derecho" data-name="Carrilero derecho"></div>
      <div class="position" id="pos-mediocentro" data-name="Mediocentro"></div>
      <div class="position" id="pos-carrilero-izquierdo" data-name="Carrilero izquierdo"></div>
      <div class="position" id="pos-centrocampista-derecho" data-name="Centrocampista derecho"></div>
      <div class="position" id="pos-centrocampista" data-name="Centrocampista"></div>
      <div class="position" id="pos-centrocampista-izquierdo" data-name="Centrocampista izquierdo"></div>
      <div class="position" id="pos-mediapunta-derecho" data-name="Mediapunta derecho"></div>
      <div class="position" id="pos-mediapunta" data-name="Mediapunta"></div>
      <div class="position" id="pos-mediapunta-izquierdo" data-name="Mediapunta izquierdo"></div>
      <div class="position" id="pos-delantero" data-name="Delantero"></div>
    </div>
  </div>

  <!-- PANEL DE ATRIBUTOS -->
  <div class="stats-panel">
    <div class="selected-pos">
      Posición: <span id="selected-name">Ninguna</span>
    </div>

    <div class="stats-header">
      <div>Técnico</div>
      <div>Mental</div>
      <div>Físico</div>
    </div>

    <div class="stats-grid">
      <!-- TÉCNICO -->
      <div>
        <div class="stat-row"><label>Cabeceo</label><input type="text" value="-"></div>
        <div class="stat-row"><label>Centros</label><input type="text" value="-"></div>
        <div class="stat-row"><label>Control</label><input type="text" value="-"></div>
        <div class="stat-row"><label>Entradas</label><input type="text" value="-"></div>
        <div class="stat-row"><label>Marcaje</label><input type="text" value="-"></div>
        <div class="stat-row"><label>Pases</label><input type="text" value="-"></div>
        <div class="stat-row"><label>Penaltis</label><input type="text" value="-"></div>
        <div class="stat-row"><label>Regate</label><input type="text" value="-"></div>
        <div class="stat-row"><label>Remate</label><input type="text" value="-"></div>
        <div class="stat-row"><label>Saques de esquina</label><input type="text" value="-"></div>
        <div class="stat-row"><label>Saques largos</label><input type="text" value="-"></div>
        <div class="stat-row"><label>Técnica</label><input type="text" value="-"></div>
        <div class="stat-row"><label>Tiros lejanos</label><input type="text" value="-"></div>
        <div class="stat-row"><label>Tiros libres</label><input type="text" value="-"></div>
      </div>

      <!-- MENTAL -->
      <div>
        <div class="stat-row"><label>Agresividad</label><input type="text" value="-"></div>
        <div class="stat-row"><label>Anticipación</label><input type="text" value="-"></div>
        <div class="stat-row"><label>Colocación</label><input type="text" value="-"></div>
        <div class="stat-row"><label>Concentración</label><input type="text" value="-"></div>
        <div class="stat-row"><label>Decisiones</label><input type="text" value="-"></div>
        <div class="stat-row"><label>Desmarques</label><input type="text" value="-"></div>
        <div class="stat-row"><label>Determinación</label><input type="text" value="-"></div>
        <div class="stat-row"><label>Juego en equipo</label><input type="text" value="-"></div>
        <div class="stat-row"><label>Liderazgo</label><input type="text" value="-"></div>
        <div class="stat-row"><label>Sacrificio</label><input type="text" value="-"></div>
        <div class="stat-row"><label>Serenidad</label><input type="text" value="-"></div>
        <div class="stat-row"><label>Talento</label><input type="text" value="-"></div>
        <div class="stat-row"><label>Valentía</label><input type="text" value="-"></div>
        <div class="stat-row"><label>Visión</label><input type="text" value="-"></div>
      </div>

      <!-- FÍSICO (sin Altura, Peso, Estilo, Condición, Ritmo) -->
      <div>
        <div class="stat-row"><label>Aceleración</label><input type="text" value="-"></div>
        <div class="stat-row"><label>Agilidad</label><input type="text" value="-"></div>
        <div class="stat-row"><label>Alcance de salto</label><input type="text" value="-"></div>
        <div class="stat-row"><label>Equilibrio</label><input type="text" value="-"></div>
        <div class="stat-row"><label>Fuerza</label><input type="text" value="-"></div>
        <div class="stat-row"><label>Recuperación física</label><input type="text" value="-"></div>
        <div class="stat-row"><label>Resistencia</label><input type="text" value="-"></div>
        <div class="stat-row"><label>Velocidad</label><input type="text" value="-"></div>
      </div>
    </div>
  </div>

  <script>
    const positions = document.querySelectorAll('.position');
    const selectedName = document.getElementById('selected-name');

    positions.forEach(pos => {
      pos.addEventListener('click', () => {
        positions.forEach(p => p.classList.remove('selected'));
        pos.classList.add('selected');
        selectedName.textContent = pos.dataset.name;
      });
    });
  </script>
</body>
</html>
